name: CD Pipeline

on:
  push:
    branches: [main]
    tags: [v*]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/aesstore:${{ github.sha }}
            ghcr.io/${{ github.repository }}/aesstore:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      
      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd /opt/aesstore
          docker-compose -f docker-compose.prod.yml down
          docker-compose -f docker-compose.prod.yml pull
          docker-compose -f docker-compose.prod.yml up -d
          docker system prune -f
          EOF
      
      - name: Verify deployment
        run: |
          sleep 30
          curl -f http://${{ secrets.APP_URL }}/api/v1/health || exit 1

  notify:
    name: Notify Deployment
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Send Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: good
          SLACK_TITLE: "Aesstore Deployment Successful"
          SLACK_MESSAGE: "Deployment to production completed successfully"
          SLACK_FOOTER: "GitHub Actions"
      
      - name: Send Discord notification
        uses: Ilshidur/action-discord@0.6.4
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBED_DATA: |
            {
              "title": "Aesstore Deployment Successful",
              "description": "Deployment to production completed successfully",
              "color": 3066993,
              "fields": [
                {
                  "name": "Commit",
                  "value": "${{ github.sha }}",
                  "inline": true
                },
                {
                  "name": "Branch",
                  "value": "${{ github.ref }}",
                  "inline": true
                }
              ]
            }
